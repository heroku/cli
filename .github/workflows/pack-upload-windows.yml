name: Pack and Upload Windows Installers

on:
  workflow_dispatch:
  workflow_call:

jobs:
  pack-and-upload-windows:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f
      - name: Install NSIS
        run: brew install nsis
      - name: npm install
        run: npm ci
      - name: pack windows installer
        run: npm run pack:win
      - name: upload windows installer
        run: npm run upload:win
